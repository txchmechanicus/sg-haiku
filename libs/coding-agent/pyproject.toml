[project]
name = "coding-agent"
version = "0.1.0"
description = "Haiku coding agent CLI and tools"
requires-python = ">=3.11"
dependencies = [
    "agent",
    "upstream",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "Pillow>=10,<12",
]

[project.scripts]
haiku = "coding_agent.cli:app"

[tool.uv.sources]
agent = { workspace = true }
upstream = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]
