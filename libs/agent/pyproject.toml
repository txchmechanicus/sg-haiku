[project]
name = "agent"
version = "0.1.0"
description = "Haiku generic agent core"
requires-python = ">=3.11"
dependencies = [
    "upstream",
    "pydantic>=2.7.0",
]

[tool.uv.sources]
upstream = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
